name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools mesa-vulkan-drivers xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libgl-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Unit tests
        run: ctest --preset release

      - name: Server smoke test
        run: ./build/release/src/server/gk_server --ticks 60 --port 7801

      - name: Online smoke test (4 headless clients, 150 ms, 2% loss)
        shell: bash
        run: |
          ./build/release/src/server/gk_server --port 7802 --ticks 1200 &
          sleep 1
          ./build/release/src/server/gk_botclient --connect 127.0.0.1:7802 --clients 4 --seconds 12 --lag 150 --loss 2 --jitter 10
          wait

      - name: Online smoke test through the master server (accounts, matchmaking, ratings)
        shell: bash
        run: |
          ./build/release/src/online/gk_master --port 7790 --data accounts.json --server-key ci &
          master=$!
          sleep 1
          ./build/release/src/server/gk_server --port 7803 --laps 1 --lobby 2 --master http://127.0.0.1:7790 --server-key ci --region eu &
          server=$!
          sleep 2
          ./build/release/src/server/gk_botclient --master http://127.0.0.1:7790 --region eu --clients 3 --seconds 180 --until-results
          sleep 3 # the server reports the race from its worker thread
          kill $server $master
          wait
          python3 -c "import json,sys; a=json.load(open('accounts.json'))['accounts']; print(a); sys.exit(0 if sum(x['races'] for x in a)==3 else 1)"

      - name: Prebuilt shaders are up to date
        if: runner.os == 'Linux'
        run: |
          python3 tools/compile_shaders.py glslangValidator shaders/prebuilt shaders/*.vert shaders/*.frag
          git diff --exit-code shaders/prebuilt

      - name: Client smoke test (software Vulkan)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./build/release/src/client/gk_client --autodrive --frames 300 --screenshot smoke.png

      - name: Upload smoke screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke.png
