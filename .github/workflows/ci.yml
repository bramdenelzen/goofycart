name: CI

# Pull requests only: every push to the main branch is built, tested and
# packaged by release.yml, so the same build doesn't run twice.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja ccache

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip -OutFile ccache.zip
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64"

      # Downloaded sources and compiled objects carry over between runs.
      - name: Cache downloads and compiler output
        uses: actions/cache@v4
        with:
          path: |
            .deps
            .ccache
          key: build-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}-

      - name: Configure
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --preset release

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build --preset release

      - name: Unit tests
        run: ctest --preset release

      - name: Server smoke test
        run: ./build/release/src/server/gk_server --ticks 60 --port 7801

      - name: Online smoke test (4 headless clients, 150 ms, 2% loss, engine voices)
        shell: bash
        run: |
          ./build/release/src/server/gk_server --port 7802 --ticks 1200 &
          sleep 1
          ./build/release/src/server/gk_botclient --connect 127.0.0.1:7802 --clients 4 --seconds 12 --lag 150 --loss 2 --jitter 10 --voices
          wait

      - name: Online smoke test through the master server (accounts, matchmaking, ratings)
        shell: bash
        run: |
          ./build/release/src/online/gk_master --port 7790 --data accounts.json --server-key ci &
          master=$!
          sleep 1
          ./build/release/src/server/gk_server --port 7803 --laps 1 --lobby 2 --master http://127.0.0.1:7790 --server-key ci --region eu &
          server=$!
          sleep 2
          ./build/release/src/server/gk_botclient --master http://127.0.0.1:7790 --region eu --clients 3 --seconds 180 --until-results
          sleep 3 # the server reports the race from its worker thread
          kill $server $master
          wait
          python3 -c "import json,sys; a=json.load(open('accounts.json'))['accounts']; print(a); sys.exit(0 if sum(x['races'] for x in a)==3 else 1)"


