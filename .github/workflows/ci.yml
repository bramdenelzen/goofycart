name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools mesa-vulkan-drivers xvfb \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libgl-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja molten-vk

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build --preset release

      - name: Unit tests
        run: ctest --preset release

      - name: Server smoke test
        run: ./build/release/src/server/gk_server --ticks 60 --port 7801

      - name: Online smoke test (4 headless clients, 150 ms, 2% loss)
        shell: bash
        run: |
          ./build/release/src/server/gk_server --port 7802 --ticks 1200 &
          sleep 1
          ./build/release/src/server/gk_botclient --connect 127.0.0.1:7802 --clients 4 --seconds 12 --lag 150 --loss 2 --jitter 10
          wait

      - name: Online smoke test through the master server (accounts, matchmaking, ratings)
        shell: bash
        run: |
          ./build/release/src/online/gk_master --port 7790 --data accounts.json --server-key ci &
          master=$!
          sleep 1
          ./build/release/src/server/gk_server --port 7803 --laps 1 --lobby 2 --master http://127.0.0.1:7790 --server-key ci --region eu &
          server=$!
          sleep 2
          ./build/release/src/server/gk_botclient --master http://127.0.0.1:7790 --region eu --clients 3 --seconds 180 --until-results
          sleep 3 # the server reports the race from its worker thread
          kill $server $master
          wait
          python3 -c "import json,sys; a=json.load(open('accounts.json'))['accounts']; print(a); sys.exit(0 if sum(x['races'] for x in a)==3 else 1)"

      - name: Prebuilt shaders are up to date
        if: runner.os == 'Linux'
        run: |
          python3 tools/compile_shaders.py glslangValidator shaders/prebuilt shaders/*.vert shaders/*.frag
          git diff --exit-code shaders/prebuilt

      - name: Client smoke test (software Vulkan)
        if: runner.os == 'Linux'
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./build/release/src/client/gk_client --autodrive --frames 300 --screenshot smoke.png

      - name: Upload smoke screenshot
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot
          path: smoke.png

      # MoltenVK only, no Vulkan loader or SDK: what a player's Mac has with the app.
      - name: Client smoke test (MoltenVK, no Vulkan loader)
        if: runner.os == 'macOS'
        run: |
          test ! -e /opt/homebrew/lib/libvulkan.1.dylib
          set -o pipefail
          export MVK_CONFIG_LOG_LEVEL=2 # MoltenVK warnings and errors
          ./build/release/src/client/gk_client --autodrive --mute --frames 300 --screenshot smoke-macos.png 2>&1 | tee client.log \
            || { cat ~/Library/"Application Support"/Gobby/GobbyKart/crashes/*.txt 2>/dev/null; exit 1; }
          grep -q "GPU:" client.log

      - name: Upload macOS smoke screenshot
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshot-macos
          path: smoke-macos.png

  server-image:
    name: Server image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the server image
        run: docker build -f deploy/Dockerfile -t gobbykart .
      - name: Master, race server and bots in containers
        run: |
          docker network create gk
          docker run -d --name gkmaster --network gk -e GK_SERVER_KEY=ci gobbykart gk_master --data /var/lib/gobbykart/accounts.json
          sleep 1
          docker run -d --name gkrace --network gk -e GK_SERVER_KEY=ci gobbykart \
            gk_server --laps 1 --lobby 2 --master http://gkmaster:7780 --region eu --public-host gkrace
          sleep 2
          docker run --rm --network gk gobbykart gk_botclient --master http://gkmaster:7780 --region eu \
            --clients 2 --seconds 180 --until-results
          sleep 3
          docker exec gkmaster cat /var/lib/gobbykart/accounts.json | python3 -c "import json,sys; a=json.load(sys.stdin)['accounts']; sys.exit(0 if sum(x['races'] for x in a)==2 else 1)"
      - name: Validate the compose files
        run: |
          for d in deploy/master deploy/region; do cp $d/example.env $d/.env; docker compose -f $d/compose.yml config -q; done
