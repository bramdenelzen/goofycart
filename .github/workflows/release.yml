name: Release

# Builds the ready-to-run game for Windows (zip) and macOS (DMG).
# - Every push to the default branch replaces the "latest" pre-release, so
#   the newest build is always one download away (no compiling).
# - Pushing a tag like v0.2.0 publishes a versioned release.
# - Running it by hand (Actions > Release > Run workflow) only uploads the
#   packages as build artifacts.
#
# macOS: the app is signed with a Developer ID and notarized when these
# repository secrets exist, and ad-hoc signed otherwise (players then have to
# right-click > Open the first time):
#   MACOS_CERT_P12 (base64 of a .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
#   ("Developer ID Application: ..."), APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD

on:
  push:
    branches: [claude/gobbykart-build-osdxg2]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja ccache molten-vk

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install ccache (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-windows-x86_64.zip -OutFile ccache.zip
          Expand-Archive ccache.zip -DestinationPath $env:RUNNER_TEMP
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\ccache-4.10.2-windows-x86_64"

      - name: Cache downloads and compiler output
        uses: actions/cache@v4
        with:
          path: |
            .deps
            .ccache
          key: release-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}-${{ github.sha }}
          restore-keys: release-${{ runner.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}-

      - name: Configure
        shell: bash
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ]; then extra=(-DGK_MACOS_BUNDLE=ON); fi
          cmake --preset release "${extra[@]}"

      - name: Build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
        run: cmake --build --preset release

      - name: Unit tests
        run: ctest --preset release

      - name: Online smoke test (4 headless clients, 150 ms, 2% loss)
        shell: bash
        run: |
          ./build/release/src/server/gk_server --port 7802 --ticks 900 &
          sleep 1
          ./build/release/src/server/gk_botclient --connect 127.0.0.1:7802 --clients 4 --seconds 8 --lag 150 --loss 2 --jitter 10
          wait

      - name: Package (zip)
        if: runner.os == 'Windows'
        run: cpack --config build/release/CPackConfig.cmake -B dist

      - name: Package (signed app in a DMG)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tools/package_macos.sh build/release dist

      - name: Check the package runs
        shell: bash
        run: |
          mkdir -p check && cd check
          if [ "$RUNNER_OS" = macOS ]; then
            hdiutil attach ../dist/*.dmg -mountpoint /tmp/gk -nobrowse
            ls /tmp/gk "/tmp/gk/Gobby Kart.app/Contents/Frameworks"
            codesign --verify --deep "/tmp/gk/Gobby Kart.app"
            /tmp/gk/gk_server --ticks 60 --port 7811
            hdiutil detach /tmp/gk
          else
            cmake -E tar xf ../dist/*.zip
            ./GobbyKart*/gk_server --ticks 60 --port 7811
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GobbyKart-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.dmg

      # The packages are stripped; these turn crash report offsets into names.
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ runner.os }}
          path: |
            build/release/src/client/gk_client*
            build/release/src/server/gk_server*
            build/release/src/online/gk_master*
          retention-days: 90

  publish:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GobbyKart-*
          path: dist
          merge-multiple: true

      - name: Versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Replace the "latest" pre-release
        if: startsWith(github.ref, 'refs/heads/')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/* --prerelease --target "$GITHUB_SHA" \
            --title "Latest build ($(echo $GITHUB_SHA | cut -c1-7))" \
            --notes "Built from $GITHUB_SHA. Windows: unzip and run gk_client.exe. macOS: open the DMG and drag Gobby Kart.app out."
