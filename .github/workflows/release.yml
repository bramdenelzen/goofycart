name: Release

# Builds the portable game packages on all three platforms. Pushing a tag
# like v0.2.0 also publishes them as a GitHub release; running it by hand
# (Actions > Release > Run workflow) only uploads them as build artifacts.
#
# macOS: the app is signed with a Developer ID and notarized when these
# repository secrets exist, and ad-hoc signed otherwise (players then have to
# right-click > Open the first time):
#   MACOS_CERT_P12 (base64 of a .p12), MACOS_CERT_PASSWORD, MACOS_SIGN_IDENTITY
#   ("Developer ID Application: ..."), APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
          - name: macOS
            os: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build glslang-tools \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev \
            libwayland-dev libxkbcommon-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libgl-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja molten-vk

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          extra=()
          if [ "$RUNNER_OS" = macOS ]; then extra=(-DGK_MACOS_BUNDLE=ON); fi
          # The C++ runtime inside the programs, so only glibc 2.39+ is needed.
          if [ "$RUNNER_OS" = Linux ]; then extra=("-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"); fi
          cmake --preset release "${extra[@]}"

      - name: Build
        run: cmake --build --preset release

      - name: Unit tests
        run: ctest --preset release

      - name: Package (zip / tarball)
        if: runner.os != 'macOS'
        run: cpack --config build/release/CPackConfig.cmake -B dist

      - name: Package (signed app in a DMG)
        if: runner.os == 'macOS'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: tools/package_macos.sh build/release dist

      - name: Check the package runs
        shell: bash
        run: |
          mkdir -p check && cd check
          if [ "$RUNNER_OS" = macOS ]; then
            hdiutil attach ../dist/*.dmg -mountpoint /tmp/gk -nobrowse
            ls /tmp/gk "/tmp/gk/Gobby Kart.app/Contents/Frameworks"
            codesign --verify --deep "/tmp/gk/Gobby Kart.app"
            /tmp/gk/gk_server --ticks 60 --port 7811
            hdiutil detach /tmp/gk
          else
            for f in ../dist/*.zip ../dist/*.tar.gz; do if [ -f "$f" ]; then cmake -E tar xf "$f"; fi; done
            ./GobbyKart*/gk_server --ticks 60 --port 7811
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: GobbyKart-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg

      # The packages are stripped; these turn crash report offsets into names.
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-${{ runner.os }}
          path: |
            build/release/src/client/gk_client*
            build/release/src/server/gk_server*
            build/release/src/online/gk_master*
          retention-days: 90

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: GobbyKart-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
